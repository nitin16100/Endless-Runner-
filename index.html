var recentMeta=0;
for(var h2=0;h2<DX.hist.length;h2++)if(META[DX.hist[h2].id])recentMeta++;

for(var i=0;i<DX.list.length;i++){var e=DX.list[i];
if(!e.enabled||c.score<(e.min||0))continue;

w*=(age<=2?0.15:0.5);}}

if(!dxSafe(e,c))w=0;

<script>

function cookieGet(k){try{var m=document.cookie.match(new RegExp("(?:^|;\\s*)nd_"+k+"=([^;]*)"));return m?JSON.parse(decodeURIComponent(m[1])):null;}catch(e){return null;}}
(function(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);

Store.set=function(q,v){_sSet2(q,v);cookieSet(q,v);};
Store.get=function(q,d){var v=_sGet2(q,null);if(v==null)v=cookieGet(q);return v==null?d:v;};
