var recentMeta=0;
for(var h2=0;h2<DX.hist.length;h2++)if(META[DX.hist[h2].id])recentMeta++;

for(var i=0;i<DX.list.length;i++){var e=DX.list[i];
if(!e.enabled||c.score<(e.min||0))continue;

w*=(age<=2?0.15:0.5);}}

if(!dxSafe(e,c))w=0;
